[project]
name = "airbnb-superhost-classifer"
version = "0.1.0"
description = "airbnb superhost classifier model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
airbnb-superhost-classifer = "airbnb_superhost_classifer:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
